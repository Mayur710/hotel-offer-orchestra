networks:
  hotel-net:
    driver: bridge

services:
  temporal-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "5432:5432"
    networks:
      - hotel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.29.7
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: temporal-db
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - "7233:7233"
    networks:
      - hotel-net
    depends_on:
      temporal-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  temporal-ui:
    image: temporalio/ui:2.51.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_UI_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - hotel-net
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - hotel-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    command: ["node", "dist/api/server.js"]
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      SUPPLIER_BASE_URL: http://app:3000
      SUPPLIER_A_DOWN: ${SUPPLIER_A_DOWN:-false}
      SUPPLIER_B_DOWN: ${SUPPLIER_B_DOWN:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    networks:
      - hotel-net
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: ["node", "dist/temporal/worker/index.js"]
    environment:
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      SUPPLIER_BASE_URL: http://app:3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks:
      - hotel-net
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'dist/temporal/worker/index.js' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
